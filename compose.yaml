services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: selfdesk-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "19200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: selfdesk-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytedesk}
      POSTGRES_USER: ${POSTGRES_USER:-bytedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytedesk_local}
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytedesk} -d ${POSTGRES_DB:-bytedesk}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfdesk-app
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: open
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SPRING_AI_DEEPSEEK_CHAT_OPTIONS_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BYTEDESK_ADMIN_PASSWORD: ${BYTEDESK_ADMIN_PASSWORD:-SelfDesk#2026}
      # 业务库：PostgreSQL（表结构由 JPA 自动创建）
      BYTEDESK_DATASOURCE_ACTIVE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bytedesk}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bytedesk}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bytedesk_local}
      # 管理员初始密码只在首次建库时生效
      # BYTEDESK_ADMIN_PASSWORD 已在下方设置
      # 演示模式：关闭验证码、开启演示订单接口
      BYTEDESK_TESTING_ENABLED: "true"
      BYTEDESK_TESTING_DISABLE_CAPTCHA: "true"
      BYTEDESK_DEMO_ORDER_API_ENABLED: "true"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1280m}
    ports:
      - "9003:9003"
    volumes:
      - appdata:/app/data
    restart: unless-stopped

volumes:
  esdata:
  appdata:
  pgdata:
