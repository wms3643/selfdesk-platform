<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelfDesk 运营仪表盘</title>
<style>
  :root{
    --page:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --surface-3:#F2F5F4;
    --line:#E3E8E6; --line-soft:#EDF1EF;
    --ink:#0E1513; --ink-2:#4A5551; --ink-3:#7C8781; --ink-4:#A5AFAA;
    --brand:#0E7A68; --brand-2:#0A5F51; --brand-tint:#E7F3F0;
    --violet:#6D5AE6; --blue:#2F6FB0; --amber:#B54708; --gold:#C08A16;
    --green:#067647; --red:#B42318; --gray:#8A948F;
    --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:20px;
    --shadow-xs:0 1px 2px rgba(14,21,19,.04);
    --shadow-sm:0 1px 3px rgba(14,21,19,.06), 0 1px 2px rgba(14,21,19,.04);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--ink); font-size:14px; line-height:1.5;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
  button,input,select{font:inherit; color:inherit}
  ::selection{background:rgba(14,122,104,.16)}

  header{
    position:sticky; top:0; z-index:20; height:60px;
    display:flex; align-items:center; gap:12px; padding:0 22px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .mark{width:28px; height:28px; border-radius:9px; background:var(--brand); display:grid; place-items:center; flex:0 0 28px}
  .title{font-size:14px; font-weight:500; letter-spacing:-.01em}
  .org{
    font-size:11.5px; color:var(--ink-3); border:1px solid var(--line);
    border-radius:6px; padding:1px 7px;
  }
  .spacer{flex:1}
  .ctl{display:flex; align-items:center; gap:8px}
  select{
    height:32px; padding:0 9px; border:1px solid var(--line); border-radius:9px;
    background:var(--surface-2); outline:none; font-size:12.5px; color:var(--ink-2); cursor:pointer;
  }
  select:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,122,104,.12)}
  button.ghost{
    height:32px; padding:0 12px; border:1px solid var(--line); border-radius:9px;
    background:var(--surface); color:var(--ink-2); font-size:12.5px; cursor:pointer; transition:.15s;
  }
  button.ghost:hover{background:var(--surface-2); border-color:#D5DCD9; color:var(--ink)}
  button.primary{
    height:32px; padding:0 14px; border:0; border-radius:9px; background:var(--brand);
    color:#fff; font-size:12.5px; font-weight:500; cursor:pointer; transition:.15s;
  }
  button.primary:hover{background:var(--brand-2)}
  .conn{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2);
    background:var(--surface-2); border:1px solid var(--line-soft); border-radius:999px; padding:4px 10px}
  .dot{width:6px; height:6px; border-radius:50%; display:inline-block}

  main{max-width:1400px; margin:0 auto; padding:22px 22px 36px}
  .grid{display:grid; gap:14px}

  .kpis{grid-template-columns:repeat(6,1fr); margin-bottom:14px}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:15px 16px 14px; box-shadow:var(--shadow-xs); transition:.15s;
  }
  .kpi:hover{box-shadow:var(--shadow-sm); border-color:#D9E0DC}
  .kpi .label{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-3)}
  .kpi .label i{width:6px; height:6px; border-radius:2px; background:var(--accent,var(--brand))}
  .kpi .value{font-size:26px; font-weight:500; line-height:1.15; letter-spacing:-.03em; margin-top:7px}
  .kpi .sub{font-size:11px; color:var(--ink-4); margin-top:5px}

  .ai-panel{margin-bottom:14px}
  .ai-body{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:22px; margin-top:14px; align-items:start}
  .ai-stats{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .ai-stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:11px 12px}
  .ai-stat .l{font-size:11px; color:var(--ink-3)}
  .ai-stat .v{font-size:19px; font-weight:500; margin-top:4px; letter-spacing:-.02em}
  .ai-stat .s{font-size:10.5px; color:var(--ink-4); margin-top:4px; line-height:1.5}
  .ai-balance{font-size:11.5px; color:var(--ink-2); display:flex; align-items:center; gap:7px;
    background:var(--brand-tint); border-radius:8px; padding:5px 10px}
  .ai-balance b{font-weight:500; color:var(--brand-2); font-size:13px}
  .ai-chart{height:146px}

  .row2{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr)}
  .row3{grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:14px}
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:16px 18px 18px; box-shadow:var(--shadow-xs);
  }
  .panel-h{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px}
  .panel-t{font-size:13px; font-weight:500; letter-spacing:-.01em}
  .panel-s{font-size:11px; color:var(--ink-4); margin-top:3px}

  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:10px}
  .legend div{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2)}
  .sw{width:8px; height:8px; border-radius:2px; flex:0 0 8px}

  .bar-row{margin-bottom:13px}
  .bar-row:last-child{margin-bottom:0}
  .bar-top{display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:6px}
  .bar-top span:last-child{color:var(--ink-3)}
  .bar-bg{height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden}
  .bar-fill{display:block; height:100%; border-radius:999px; transition:width .5s ease}

  .health-item{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
  .health-item:last-child{border-bottom:0; padding-bottom:0}
  .badge-l{width:3px; border-radius:2px; flex:0 0 3px; margin-top:3px}
  .health-item .h-t{font-size:12.5px; font-weight:500}
  .health-item .h-d{font-size:11.5px; color:var(--ink-3); margin-top:3px; line-height:1.55}

  table{width:100%; border-collapse:collapse; font-size:12.5px}
  th{
    text-align:left; font-weight:400; color:var(--ink-4); font-size:11px;
    padding:0 10px 9px; border-bottom:1px solid var(--line);
  }
  td{padding:10px; border-bottom:1px solid var(--line-soft); color:var(--ink)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .st{
    display:inline-flex; align-items:center; gap:5px; font-size:11px;
    padding:2px 8px; border-radius:999px; background:var(--surface-3); color:var(--ink-2);
  }
  .st i{width:5px; height:5px; border-radius:50%; display:block}
  .mono{font-family:"JetBrains Mono",Consolas,monospace; font-size:11px; color:var(--ink-3)}

  footer{
    max-width:1400px; margin:0 auto; padding:0 22px 28px;
    display:flex; gap:18px; flex-wrap:wrap; align-items:center;
    font-size:11.5px; color:var(--ink-4);
  }
  footer b{font-weight:500; color:var(--ink-3)}

  /* ── 登录 ─────────────────────────────── */
  #login{min-height:100vh; display:grid; place-items:center; padding:24px}
  .login-card{
    width:100%; max-width:404px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-xl); padding:32px; box-shadow:0 30px 70px -34px rgba(14,21,19,.30), 0 2px 8px rgba(14,21,19,.04);
  }
  .lockup{display:flex; align-items:center; gap:10px; margin-bottom:26px}
  .lockup .mark{width:34px; height:34px; border-radius:11px; flex:0 0 34px}
  .lockup .brand{font-size:14.5px; font-weight:500; letter-spacing:-.01em}
  .lockup .env{font-size:11px; color:var(--ink-3); border:1px solid var(--line); border-radius:6px; padding:2px 6px}
  .login-card h2{font-size:22px; font-weight:500; letter-spacing:-.02em; margin:0 0 6px}
  .login-card p.hint{font-size:12.5px; color:var(--ink-3); margin:0 0 24px; line-height:1.6}
  label{display:block; font-size:12px; color:var(--ink-2); margin-bottom:7px}
  input{
    width:100%; height:42px; padding:0 13px; margin-bottom:16px;
    border:1px solid var(--line); border-radius:10px; background:var(--surface-2);
    outline:none; transition:.15s; color:var(--ink);
  }
  input::placeholder{color:var(--ink-4)}
  input:focus{background:var(--surface); border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,122,104,.14)}
  .err{color:var(--red); font-size:12px; margin-top:10px; background:#FCECEA; border-radius:8px; padding:8px 10px}
  .err:empty{display:none}
  .login-card button.primary{width:100%; height:44px; margin-top:4px; font-size:13.5px}
  .demo{margin-top:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; padding:10px 12px;
    font-size:11.5px; color:var(--ink-3)}
  .demo code{font-family:Consolas,monospace; font-size:11px; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--line-soft); border-radius:5px; padding:1px 5px}

  .skel{background:linear-gradient(90deg,#F2F5F4 25%,#FAFBFA 37%,#F2F5F4 63%);
    background-size:400% 100%; animation:sh 1.2s ease infinite; border-radius:6px; height:12px}
  @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .fade{opacity:.45; transition:opacity .2s}

  /* 嵌入模式：被后台 iframe 引用时隐藏自身头部/页脚，避免双层导航 */
  html.embed header{display:none}
  html.embed footer{display:none}
  html.embed main{padding-top:12px}
  html.embed #login{min-height:calc(100vh - 24px)}
  #logout{display:none}

  @media (max-width:1180px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .row2{grid-template-columns:1fr}
    .row3{grid-template-columns:1fr}
    .ai-body{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    main{padding:16px 14px 32px}
    header{padding:0 14px; gap:8px}
    .org,.conn{display:none}
  }
</style>
</head>
<body>

<section id="login" hidden>
  <div class="login-card">
    <div class="lockup">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
          <path d="M4.6 7.2A3.6 3.6 0 0 1 8.2 3.6h7.6a3.6 3.6 0 0 1 3.6 3.6v4.6a3.6 3.6 0 0 1-3.6 3.6h-3.9l-4.1 3.3v-3.4A3.6 3.6 0 0 1 4.6 11.8V7.2Z" fill="#fff"/>
          <circle cx="9.1" cy="9.4" r="1.05" fill="#0E7A68"/>
          <circle cx="12" cy="9.4" r="1.05" fill="#0E7A68"/>
          <circle cx="14.9" cy="9.4" r="1.05" fill="#0E7A68"/>
        </svg>
      </div>
      <span class="brand">SelfDesk</span>
      <span class="env">运营仪表盘</span>
    </div>
    <h2>登录仪表盘</h2>
    <p class="hint">使用客服工作台账号登录，数据来自本机 9003 应用。</p>
    <form id="loginForm">
      <label for="u">账号</label>
      <input id="u" autocomplete="username" value="admin@email.com" required>
      <label for="p">密码</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="输入登录密码" required>
      <button class="primary" type="submit">进入仪表盘</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="demo"><span>演示账号</span><code>admin@email.com</code></div>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
        <path d="M4.6 7.2A3.6 3.6 0 0 1 8.2 3.6h7.6a3.6 3.6 0 0 1 3.6 3.6v4.6a3.6 3.6 0 0 1-3.6 3.6h-3.9l-4.1 3.3v-3.4A3.6 3.6 0 0 1 4.6 11.8V7.2Z" fill="#fff"/>
        <circle cx="9.1" cy="9.4" r="1.05" fill="#0E7A68"/>
        <circle cx="12" cy="9.4" r="1.05" fill="#0E7A68"/>
        <circle cx="14.9" cy="9.4" r="1.05" fill="#0E7A68"/>
      </svg>
    </div>
    <div class="title">运营仪表盘</div>
    <div class="org num" id="orgName">MyCompany</div>
    <div class="spacer"></div>
    <div class="ctl">
      <span class="conn"><span class="dot" id="connDot" style="background:var(--brand)"></span><span id="connText">已连接</span></span>
      <select id="range">
        <option value="7">近 7 天</option>
        <option value="14">近 14 天</option>
        <option value="30">近 30 天</option>
      </select>
      <button class="ghost" id="refresh">刷新</button>
      <button class="ghost" id="logout">退出</button>
    </div>
  </header>

  <main>
    <div class="grid kpis" id="kpis"></div>

    <div class="panel ai-panel">
      <div class="panel-h">
        <div>
          <div class="panel-t">AI 用量与费用</div>
          <div class="panel-s" id="aiSub">按 DeepSeek 官方单价估算，输入按缓存未命中计</div>
        </div>
        <div class="ai-balance" id="aiBalance"></div>
      </div>
      <div class="ai-body">
        <div class="ai-stats" id="aiStats"></div>
        <div>
          <div class="ai-chart" id="aiChart"></div>
          <div class="legend" id="aiLegend" style="margin-top:6px"></div>
        </div>
      </div>
    </div>

    <div class="grid row2">
      <div class="panel">
        <div class="panel-h">
          <div>
            <div class="panel-t">会话趋势</div>
            <div class="panel-s" id="trendSub">每日新建会话与转人工次数</div>
          </div>
          <div class="legend" style="margin-top:0">
            <div><span class="sw" style="background:var(--brand)"></span>新建会话</div>
            <div><span class="sw" style="background:var(--red)"></span>转人工</div>
          </div>
        </div>
        <div id="trendChart" style="height:238px"></div>
      </div>

      <div class="panel">
        <div class="panel-h">
          <div>
            <div class="panel-t">会话状态</div>
            <div class="panel-s">当前全部会话构成</div>
          </div>
        </div>
        <div id="donut" style="height:186px;display:grid;place-items:center"></div>
        <div class="legend" id="donutLegend" style="justify-content:center"></div>
      </div>
    </div>

    <div class="grid row3">
      <div class="panel">
        <div class="panel-h"><div><div class="panel-t">来源渠道</div><div class="panel-s">会话按接入渠道</div></div></div>
        <div id="channels" style="margin-top:6px"></div>
      </div>
      <div class="panel">
        <div class="panel-h"><div><div class="panel-t">工作组负载</div><div class="panel-s">会话量与坐席在线情况</div></div></div>
        <div id="workgroups" style="margin-top:6px"></div>
      </div>
      <div class="panel">
        <div class="panel-h"><div><div class="panel-t">系统健康</div><div class="panel-s">基于当前数据自动诊断</div></div></div>
        <div id="health" style="margin-top:2px"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="panel-h" style="margin-bottom:14px">
        <div><div class="panel-t">最近会话</div><div class="panel-s" id="recentSub">按最后活动时间排序</div></div>
        <a href="http://localhost:9003/console/" target="_blank" style="font-size:12px;color:var(--brand);text-decoration:none">打开客服工作台 →</a>
      </div>
      <table>
        <thead>
          <tr><th style="width:23%">访客</th><th style="width:20%">工作组</th><th style="width:14%">状态</th>
              <th style="width:10%">消息</th><th style="width:18%">最后活动</th><th>会话号</th></tr>
        </thead>
        <tbody id="recent"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <span>数据来源 <b id="src">SelfDesk /api/v1</b></span>
    <span>生成于 <b id="gen">—</b></span>
    <span>自动刷新 <b id="countdown">30s</b></span>
    <span id="lastActivity"></span>
  </footer>
</div>

<script>
const STATUS_COLOR = {
  NEW:"#C08A16", ROBOTING:"#0E7A68", QUEUING:"#B54708",
  CHATTING:"#6D5AE6", OFFLINE:"#8A948F", CLOSED:"#C3CBC7"
};
const KPI_DEF = [
  {key:"threads",     label:"会话总数",   accent:"var(--brand)",  sub:d=>`今日新增 ${d.threadsToday}`},
  {key:"active",      label:"进行中",     accent:"var(--gold)",   sub:d=>`占比 ${pct(d.active,d.threads)}%`},
  {key:"closed",      label:"已结束",     accent:"var(--gray)",   sub:d=>`平均 ${d.avgMessages} 条消息/会话`},
  {key:"messages",    label:"消息总数",   accent:"var(--blue)",   sub:d=>`访客 ${d.visitorMessages} · 机器人 ${d.robotMessages} · 坐席 ${d.agentMessages}`},
  {key:"visitors",    label:"访客数",     accent:"var(--violet)", sub:d=>`在线 ${d.visitorsOnline}`},
  {key:"transferRate",label:"转人工率",   accent:"var(--red)",    sub:d=>`${d.transfers} 次转人工`, suffix:"%"}
];

let state = {token:localStorage.getItem("sd_token"), days:7, data:null, timer:null, tick:0, busy:false};

if (new URLSearchParams(location.search).has("embed")) {
  document.documentElement.classList.add("embed");
}

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b ? Math.round(a*1000/b)/10 : 0;

function setView(logged){
  $("login").hidden = logged;
  $("app").hidden = !logged;
}

async function api(path, opts={}){
  const headers = {"Content-Type":"application/json"};
  if (state.token) headers["X-Token"] = state.token;
  const res = await fetch(path, {...opts, headers});
  const text = await res.text();
  let body = null;
  try { body = JSON.parse(text); } catch(e) { body = {detail:text.slice(0,180)}; }
  if (!res.ok) {
    const err = new Error(body.detail || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return body;
}

async function doLogin(user, pass){
  const r = await api("/api/login", {method:"POST", body:JSON.stringify({username:user, password:pass})});
  state.token = r.data.accessToken;
  localStorage.setItem("sd_token", state.token);
  localStorage.setItem("sd_user", user);
}

function doLogout(showLogin=true){
  state.token = null;
  localStorage.removeItem("sd_token");
  if (state.timer) clearInterval(state.timer);
  if (showLogin) setView(false);
  else setView(false);
}

async function load(){
  if (state.busy) return;
  state.busy = true;
  $("refresh").textContent = "刷新中";
  try {
    const d = await api(`/api/summary?days=${state.days}`);
    state.data = d;
    render(d);
    $("connDot").style.background = "var(--brand)";
    $("connText").textContent = "已连接";
    $("countdown").textContent = "30s";
    state.tick = 30;
  } catch (e) {
    state.busy = false;
    $("refresh").textContent = "刷新";
    if (e.status === 401) { setView(false); return; }
    $("connDot").style.background = "var(--red)";
    $("connText").textContent = "连接异常";
    $("countdown").textContent = e.message.slice(0, 40);
    return;
  } finally {
    state.busy = false;
    $("refresh").textContent = "刷新";
  }
}

function render(d){
  $("orgName").textContent = d.org.name;
  $("gen").textContent = d.generatedAt;
  $("src").textContent = d.upstream.replace(/^https?:\/\//,"") + " /api/v1";
  $("lastActivity").textContent = d.lastActivity ? ("最后活动 " + d.lastActivity) : "";
  renderKPI(d.kpi);
  renderAI(d.ai);
  renderTrend(d.trend);
  renderDonut(d.status, d.kpi.threads);
  renderChannels(d.channels);
  renderWorkgroups(d.workgroups);
  renderHealth(d.health);
  renderRecent(d.recent);
}

function renderKPI(k){
  $("kpis").innerHTML = KPI_DEF.map(def=>{
    const raw = k[def.key] ?? 0;
    return `<div class="kpi" style="--accent:${def.accent}">
      <div class="label"><i></i>${def.label}</div>
      <div class="value num" data-target="${raw}" data-suffix="${def.suffix||""}">0</div>
      <div class="sub">${esc(def.sub(k))}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".kpi .value").forEach(el=>countUp(el));
}

function countUp(el){
  const target = parseFloat(el.dataset.target) || 0;
  const suffix = el.dataset.suffix || "";
  const dec = String(el.dataset.target).includes(".") ? 1 : 0;
  if (window.__PREVIEW__) { el.textContent = target.toFixed(dec) + suffix; return; }
  const start = performance.now(), dur = 560;
  function frame(t){
    const p = Math.min(1, (t-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = (target*eased).toFixed(dec) + suffix;
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = target.toFixed(dec) + suffix;
  }
  requestAnimationFrame(frame);
}

function renderTrend(rows){
  const W = 720, H = 238, L = 38, R = 14, T = 16, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const max = Math.max(1, ...rows.map(r=>r.total));
  const top = Math.ceil(max / 4) * 4 || 4;
  const x = i => L + (rows.length === 1 ? iw/2 : iw * i / (rows.length-1));
  const y = v => T + ih - ih * v / top;

  let grid = "";
  for (let i=0;i<=4;i++){
    const v = top*i/4, yy = y(v);
    grid += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="#EDF1EF" stroke-width="1"/>`;
    grid += `<text x="${L-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#A5AFAA">${v}</text>`;
  }

  const pts = rows.map((r,i)=>[x(i), y(r.total)]);
  const line = pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${x(rows.length-1).toFixed(1)} ${(T+ih).toFixed(1)} L${L} ${(T+ih).toFixed(1)} Z`;
  const tpts = rows.map((r,i)=>`${x(i).toFixed(1)},${y(r.transfer).toFixed(1)}`).join(" ");

  let dots = "";
  rows.forEach((r,i)=>{
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(r.total).toFixed(1)}" r="3" fill="#fff" stroke="#0E7A68" stroke-width="2">
      <title>${r.date} · 新建 ${r.total} · 结束 ${r.closed} · 转人工 ${r.transfer}</title></circle>`;
  });

  let labels = "";
  const step = rows.length > 14 ? Math.ceil(rows.length/7) : 1;
  rows.forEach((r,i)=>{
    if (i % step && i !== rows.length-1) return;
    labels += `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#A5AFAA">${r.date.slice(5)}</text>`;
  });

  $("trendChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E7A68" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0E7A68" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="#0E7A68" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${rows.some(r=>r.transfer) ? `<polyline points="${tpts}" fill="none" stroke="#B42318" stroke-width="1.6" stroke-dasharray="4 4" stroke-linejoin="round"/>` : ""}
    ${dots}${labels}
  </svg>`;
  const sum = rows.reduce((a,r)=>a+r.total,0);
  $("trendSub").textContent = `近 ${rows.length} 天共新建 ${sum} 个会话 · 每日新建与转人工`;
}

function renderDonut(rows, total){
  const size = 168, r = 62, c = size/2, sw = 14, circ = 2*Math.PI*r;
  let offset = 0, segs = "";
  rows.forEach(row=>{
    const len = circ * (row.count/Math.max(1,total));
    segs += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${STATUS_COLOR[row.key]||"#C3CBC7"}"
      stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt">
      <title>${row.label} ${row.count} (${row.percent}%)</title></circle>`;
    offset += len;
  });
  if (!rows.length){
    segs = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#EDF1EF" stroke-width="${sw}"/>`;
  }
  $("donut").innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${segs}
    <text x="${c}" y="${c-4}" text-anchor="middle" font-size="24" font-weight="500" fill="#0E1513">${total}</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" font-size="11" fill="#7C8781">会话总数</text>
  </svg>`;
  $("donutLegend").innerHTML = rows.map(row=>
    `<div><span class="sw" style="background:${STATUS_COLOR[row.key]||"#C3CBC7"}"></span>${esc(row.label)} ${row.count}</div>`
  ).join("");
}

function renderChannels(rows){
  const max = Math.max(1, ...rows.map(r=>r.count));
  const colors = ["#0E7A68","#2F6FB0","#6D5AE6","#C08A16"];
  $("channels").innerHTML = rows.length ? rows.map((r,i)=>
    `<div class="bar-row">
      <div class="bar-top"><span>${esc(r.label)}</span><span class="num">${r.count} · ${r.percent}%</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(r.count/max*100).toFixed(1)}%;background:${colors[i%4]}"></div></div>
    </div>`).join("") : `<div class="panel-s">暂无数据</div>`;
}

function renderWorkgroups(rows){
  const max = Math.max(1, ...rows.map(r=>r.threads));
  $("workgroups").innerHTML = rows.length ? rows.map(r=>
    `<div class="bar-row">
      <div class="bar-top"><span>${esc(r.name)}</span><span class="num">${r.threads} 会话</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(r.threads/max*100).toFixed(1)}%;background:${r.available>0?"#0E7A68":"#C08A16"}"></div></div>
      <div style="font-size:11px;color:var(--ink-4);margin-top:5px">可用坐席 ${r.available} · 离线 ${r.offline}</div>
    </div>`).join("") : `<div class="panel-s">暂无数据</div>`;
}

const fmtTokens = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M"
  : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n || 0);
const fmtCny = v => v >= 1 ? "¥" + v.toFixed(2) : "¥" + v.toFixed(4);

function renderAI(ai){
  if (!ai) return;
  const t = ai.today || {}, all = ai.total || {};

  $("aiStats").innerHTML = [
    ["今日调用", (t.calls || 0) + " 次", `累计 ${all.calls || 0} 次`],
    ["今日 tokens", fmtTokens(t.tokens || 0), `输入 ${fmtTokens(t.prompt || 0)} · 输出 ${fmtTokens(t.completion || 0)}`],
    ["今日费用", fmtCny(t.costCny || 0), `累计 ${fmtCny(all.costCny || 0)}`],
    ["平均响应", (ai.avgResponseMs || 0) + " ms", `成功率 ${ai.successRate ?? 100}%`]
  ].map(([l, v, s]) =>
    `<div class="ai-stat"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`
  ).join("");

  const b = ai.balance || {};
  $("aiBalance").innerHTML = b.available
    ? `DeepSeek 余额 <b class="num">${b.currency === "CNY" ? "¥" : "$"}${(b.total || 0).toFixed(2)}</b>`
    : `<span style="color:var(--ink-3)">余额暂不可用</span>`;

  const rows = ai.trend || [];
  const max = Math.max(1, ...rows.map(r => r.tokens));
  const W = 560, H = 146, L = 8, R = 8, T = 12, B = 22;
  const iw = W - L - R, ih = H - T - B;
  const bw = Math.max(5, Math.min(26, iw / Math.max(1, rows.length) - 10));
  let bars = "", labels = "";
  rows.forEach((r, i) => {
    const cx = L + (iw / rows.length) * (i + 0.5);
    const totalH = ih * ((r.tokens || 0) / max);
    const inH = ih * ((r.prompt || 0) / max);
    const outH = Math.max(0, totalH - inH);
    const baseY = T + ih;
    bars += `<rect x="${(cx - bw/2).toFixed(1)}" y="${(baseY - inH).toFixed(1)}" width="${bw.toFixed(1)}" height="${inH.toFixed(1)}" fill="#0E7A68" rx="2"><title>${r.date} 输入 ${r.prompt} tokens</title></rect>`;
    bars += `<rect x="${(cx - bw/2).toFixed(1)}" y="${(baseY - totalH).toFixed(1)}" width="${bw.toFixed(1)}" height="${outH.toFixed(1)}" fill="#8FCBBC" rx="2"><title>${r.date} 输出 ${r.completion} tokens</title></rect>`;
    const step = rows.length > 14 ? Math.ceil(rows.length / 7) : 1;
    if (i % step === 0 || i === rows.length - 1) {
      labels += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#A5AFAA">${r.date.slice(5)}</text>`;
    }
  });
  const base = `<line x1="${L}" y1="${T + ih}" x2="${W - R}" y2="${T + ih}" stroke="#EDF1EF" stroke-width="1"/>`;

  $("aiChart").innerHTML = ai.records
    ? `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">${base}${bars}${labels}</svg>`
    : `<div style="display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:12px">暂无 AI 调用记录</div>`;
  $("aiLegend").innerHTML = [
    `<div><span class="sw" style="background:#0E7A68"></span>输入 tokens</div>`,
    `<div><span class="sw" style="background:#8FCBBC"></span>输出 tokens</div>`,
    `<div style="color:var(--ink-4)">共 ${ai.records} 次调用</div>`
  ].join("");
}

function renderHealth(items){  const color = {warn:"var(--amber)", info:"var(--brand)", ok:"var(--green)"};
  $("health").innerHTML = items.map(it=>
    `<div class="health-item">
      <div class="badge-l" style="background:${color[it.level]||"var(--gray)"}"></div>
      <div><div class="h-t">${esc(it.title)}</div><div class="h-d">${esc(it.detail)}</div></div>
    </div>`).join("");
}

function renderRecent(rows){
  const color = key => STATUS_COLOR[key] || "#C3CBC7";
  $("recent").innerHTML = rows.map(r=>
    `<tr>
      <td>${esc(r.visitor)}${r.transfer ? `<span style="font-size:10px;color:var(--red);margin-left:6px">转人工</span>`:""}</td>
      <td style="color:var(--ink-2)">${esc(r.workgroup)}</td>
      <td><span class="st"><i style="background:${color(r.status)}"></i>${esc(r.statusLabel)}</span></td>
      <td class="num">${r.messages}</td>
      <td style="color:var(--ink-2)">${esc(r.updatedAt)}</td>
      <td class="mono">${esc(r.topic || r.uid)}</td>
    </tr>`).join("");
}

$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await doLogin($("u").value.trim(), $("p").value);
    setView(true);
    await load();
    startTimer();
  } catch(err){
    $("loginErr").textContent = err.message;
  }
});
$("refresh").addEventListener("click", load);
$("logout").addEventListener("click", ()=>{ doLogout(); $("p").value=""; });
$("range").addEventListener("change", e=>{ state.days = +e.target.value; load(); });

function startTimer(){
  if (state.timer) clearInterval(state.timer);
  state.tick = 30;
  state.timer = setInterval(()=>{
    if (document.hidden) return;
    state.tick -= 1;
    if (state.tick <= 0){ state.tick = 30; load(); }
    $("countdown").textContent = state.tick + "s";
  }, 1000);
}

(async function init(){
  if (window.__PREVIEW__){
    state.token = "preview";
    setView(true);
    render(window.__PREVIEW__);
    $("countdown").textContent = "预览模式";
    return;
  }
  // 免密优先：服务端已自动登录，直接进
  try {
    const d = await api(`/api/summary?days=${state.days}`);
    state.data = d;
    setView(true);
    render(d);
    startTimer();
    return;
  } catch (e) {
    if (e.status !== 401) {
      setView(true);
      $("connDot").style.background = "var(--red)";
      $("connText").textContent = "连接异常";
      $("countdown").textContent = e.message.slice(0, 40);
      return;
    }
  }
  // 自动登录失败时才退回手动登录
  setView(false);
})();
</script>
